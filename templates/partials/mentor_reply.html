{% load zt %}
<div class="flex justify-end animate-slide-in">
  <p class="max-w-[85%] rounded-2xl rounded-br-md border border-zt-border bg-zt-elevated px-4 py-3 text-sm text-zt-text">{{ mentor_prompt.question }}</p>
</div>
<div class="flex gap-3 animate-slide-in" style="animation-delay:.15s">
  <span class="flex size-8 shrink-0 items-center justify-center rounded-lg border border-zt-neon/30 bg-zt-neon/10 text-zt-neon">{% icon "sparkles" "size-4" %}</span>
  <div class="min-w-0 max-w-[90%] rounded-2xl rounded-tl-md border border-zt-neon/15 bg-zt-card px-4 py-3 text-sm leading-relaxed text-zt-text2 [&_code]:rounded [&_code]:bg-zt-bg [&_code]:px-1 [&_code]:font-mono [&_code]:text-[12px] [&_code]:text-zt-neon [&_strong]:text-zt-text">
    <p class="mb-2 font-mono text-[10px] uppercase tracking-[.16em] text-zt-warn">Sample response</p>
    <ul class="space-y-2">
      {% for line in mentor_prompt.answer %}<li class="flex gap-2"><span class="mt-2 size-1 shrink-0 rounded-full bg-zt-neon"></span><span>{{ line|safe }}</span></li>{% endfor %}
    </ul>
    <p class="mt-3 border-t border-zt-border pt-3 text-zt-text">{{ mentor_prompt.followup }}</p>
  </div>
</div>
