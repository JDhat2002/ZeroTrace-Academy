{% load zt %}
<figure class="window" aria-label="Illustrative preview of a forensic investigation workstation using a fictional training case">
  <div class="window-bar">
    <div class="window-dots"><span></span><span></span><span></span></div>
    <span class="hidden truncate font-mono text-[11px] text-zt-muted sm:inline">forensight / cases / ZT-TRN-0042</span>
    <span class="preview-label ml-auto">Training case · fictional</span>
  </div>
  <div class="space-y-3 p-3 sm:p-4">
    <div class="flex flex-wrap items-center justify-between gap-3 rounded-xl border border-zt-border bg-zt-card p-4">
      <div>
        <p class="font-mono text-[10px] uppercase tracking-[.18em] text-zt-muted">Case ZT-TRN-0042</p>
        <p class="mt-1 text-sm font-semibold text-zt-text">Suspected data exfiltration · Finance workstation</p>
      </div>
      <div class="flex flex-wrap gap-2"><span class="chip chip-warn">In analysis</span><span class="chip">3 evidence items</span></div>
    </div>

    <div class="panel overflow-hidden p-0">
      <div class="panel-title border-b border-zt-border px-4 py-3 mb-0"><span class="flex items-center gap-2">{% icon "hard-drive" "size-3.5 text-zt-neon" %} Evidence</span><span>Integrity</span></div>
      <div class="overflow-x-auto scrollbar-none">
        <table class="w-full min-w-[520px] text-left font-mono text-[11px]">
          <thead class="text-zt-muted"><tr><th class="px-4 py-2 font-medium">Item</th><th class="px-4 py-2 font-medium">Type</th><th class="px-4 py-2 font-medium">SHA-256</th><th class="px-4 py-2 font-medium">Status</th></tr></thead>
          <tbody class="divide-y divide-zt-border text-zt-text2">
            <tr><td class="px-4 py-2 text-zt-text">FIN-WS07.E01</td><td class="px-4 py-2">Disk image</td><td class="px-4 py-2">9f2c…a71e</td><td class="px-4 py-2 text-zt-neon">✓ verified</td></tr>
            <tr><td class="px-4 py-2 text-zt-text">FIN-WS07.mem</td><td class="px-4 py-2">Memory dump</td><td class="px-4 py-2">41bd…0c93</td><td class="px-4 py-2 text-zt-neon">✓ verified</td></tr>
            <tr><td class="px-4 py-2 text-zt-text">edge-fw.pcapng</td><td class="px-4 py-2">Packet capture</td><td class="px-4 py-2">c07e…5d2b</td><td class="px-4 py-2 text-zt-warn">hashing…</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <div class="grid grid-cols-1 gap-3 md:grid-cols-2">
      <div class="panel">
        <div class="panel-title"><span class="flex items-center gap-2">{% icon "memory-stick" "size-3.5 text-zt-neon" %} Memory · processes</span></div>
        <ul class="space-y-1.5 font-mono text-[11px]">
          <li class="flex justify-between text-zt-text2"><span>explorer.exe</span><span class="text-zt-muted">PID 4120</span></li>
          <li class="flex justify-between text-zt-text2"><span>└ powershell.exe</span><span class="text-zt-muted">PID 5532</span></li>
          <li class="flex justify-between rounded bg-zt-error/10 px-1 -mx-1 text-zt-error"><span>&nbsp;&nbsp;└ rundll32.exe</span><span>injected?</span></li>
          <li class="flex justify-between text-zt-text2"><span>svchost.exe</span><span class="text-zt-muted">PID 912</span></li>
        </ul>
      </div>
      <div class="panel">
        <div class="panel-title"><span class="flex items-center gap-2">{% icon "audio-waveform" "size-3.5 text-zt-neon" %} Network capture</span></div>
        <div class="flex h-14 items-end gap-[3px]" aria-hidden="true">
          <span class="w-full rounded-sm bg-zt-moss" style="height:20%"></span><span class="w-full rounded-sm bg-zt-moss" style="height:35%"></span><span class="w-full rounded-sm bg-zt-moss" style="height:25%"></span><span class="w-full rounded-sm bg-zt-moss" style="height:40%"></span><span class="w-full rounded-sm bg-zt-moss" style="height:30%"></span><span class="w-full rounded-sm bg-zt-moss" style="height:45%"></span><span class="w-full rounded-sm bg-zt-neon/70" style="height:80%"></span><span class="w-full rounded-sm bg-zt-neon" style="height:100%"></span><span class="w-full rounded-sm bg-zt-neon/70" style="height:70%"></span><span class="w-full rounded-sm bg-zt-moss" style="height:35%"></span><span class="w-full rounded-sm bg-zt-moss" style="height:25%"></span><span class="w-full rounded-sm bg-zt-moss" style="height:30%"></span><span class="w-full rounded-sm bg-zt-moss" style="height:20%"></span><span class="w-full rounded-sm bg-zt-moss" style="height:28%"></span>
        </div>
        <p class="mt-2 font-mono text-[10.5px] text-zt-warn">Spike 14:22 · 10.0.4.7 → 203.0.113.50:443</p>
      </div>
    </div>

    <div class="grid grid-cols-1 gap-3 md:grid-cols-[1.4fr_1fr]">
      <div class="panel">
        <div class="panel-title"><span class="flex items-center gap-2">{% icon "list-tree" "size-3.5 text-zt-neon" %} Timeline</span></div>
        <ol class="space-y-2 font-mono text-[11px] text-zt-text2">
          <li><span class="text-zt-muted">14:03</span> Phishing attachment opened</li>
          <li><span class="text-zt-muted">14:05</span> Encoded PowerShell executed</li>
          <li><span class="text-zt-muted">14:22</span> Outbound transfer 48 MB</li>
        </ol>
      </div>
      <div class="panel">
        <div class="panel-title"><span class="flex items-center gap-2">{% icon "file-text" "size-3.5 text-zt-neon" %} Report</span><span>60%</span></div>
        <div class="h-1.5 overflow-hidden rounded-full bg-zt-border"><div class="h-full w-3/5 bg-zt-neon"></div></div>
        <ul class="mt-3 space-y-1 text-[11px] text-zt-text2"><li>✓ Executive summary</li><li>✓ Evidence log</li><li class="text-zt-muted">○ Findings &amp; recommendations</li></ul>
      </div>
    </div>
  </div>
</figure>
