{% load zt %}
<figure class="window relative" aria-label="Illustrative preview of a ZeroTrace Cyber Range session">
  <div class="window-bar">
    <div class="window-dots"><span></span><span></span><span></span></div>
    <span class="hidden truncate font-mono text-[11px] text-zt-muted sm:inline">range.zerotrace / session / web-pentest-101</span>
    <span class="preview-label ml-auto">{% icon "eye" "size-3" %} Illustrative preview</span>
  </div>

  <div class="grid lg:grid-cols-[230px_1fr]">
    {# Machine list #}
    <aside class="border-b border-zt-border p-4 lg:border-b-0 lg:border-r" aria-label="Lab machines">
      <p class="panel-title">Lab network · 10.10.0.0/24</p>
      <ul class="grid grid-cols-2 gap-2 sm:grid-cols-4 lg:grid-cols-1">
        <li class="flex items-center gap-2.5 rounded-lg border border-zt-neon/30 bg-zt-neon/[.06] p-2.5">
          {% icon "square-terminal" "size-4 text-zt-neon" %}
          <span class="min-w-0"><span class="block truncate text-xs font-semibold text-zt-text">Kali Linux</span><span class="block font-mono text-[10px] text-zt-muted">10.10.0.2 · attacker</span></span>
        </li>
        <li class="flex items-center gap-2.5 rounded-lg border border-zt-border p-2.5">
          {% icon "server" "size-4 text-zt-text2" %}
          <span class="min-w-0"><span class="block truncate text-xs font-semibold text-zt-text">Ubuntu Server</span><span class="block font-mono text-[10px] text-zt-muted">10.10.0.5 · target</span></span>
        </li>
        <li class="flex items-center gap-2.5 rounded-lg border border-zt-border p-2.5">
          {% icon "app-window" "size-4 text-zt-text2" %}
          <span class="min-w-0"><span class="block truncate text-xs font-semibold text-zt-text">Windows 11 WS</span><span class="block font-mono text-[10px] text-zt-muted">10.10.0.12 · target</span></span>
        </li>
        <li class="flex items-center gap-2.5 rounded-lg border border-zt-border p-2.5">
          {% icon "globe" "size-4 text-zt-text2" %}
          <span class="min-w-0"><span class="block truncate text-xs font-semibold text-zt-text">Vuln Web App</span><span class="block font-mono text-[10px] text-zt-muted">10.10.0.8 · target</span></span>
        </li>
      </ul>
      <div class="mt-4 hidden rounded-lg border border-zt-border bg-zt-bg p-3 lg:block">
        <p class="font-mono text-[10px] uppercase tracking-widest text-zt-muted">Session</p>
        <p class="mt-1 flex items-center gap-2 font-mono text-xs text-zt-text">{% icon "lock" "size-3.5 text-zt-neon" %} Isolated · no internet</p>
        <div class="mt-3 h-1.5 overflow-hidden rounded-full bg-zt-border"><div class="h-full w-2/3 rounded-full bg-zt-neon/70"></div></div>
        <p class="mt-1.5 font-mono text-[10px] text-zt-muted">Example timer 40:00 / 60:00</p>
      </div>
    </aside>

    <div class="grid gap-3 p-3 sm:p-4 md:grid-cols-2 xl:grid-cols-3">
      {# Kali terminal #}
      <div class="panel md:col-span-2 xl:col-span-2">
        <div class="panel-title"><span class="flex items-center gap-2">{% icon "terminal" "size-3.5 text-zt-neon" %} kali — terminal</span><span>tty1</span></div>
        <div class="term space-y-1 overflow-x-auto scrollbar-none whitespace-pre">
<p><span class="p">learner@kali</span>:<span class="t">~/lab</span>$ nmap -sV -T4 10.10.0.0/24</p><p class="c">Nmap scan report for 10.10.0.5</p><p>22/tcp   <span class="p">open</span>  ssh      OpenSSH 8.9p1</p><p>80/tcp   <span class="p">open</span>  http     Apache httpd 2.4.52</p><p>3306/tcp <span class="w">filtered</span> mysql</p><p class="c">Nmap scan report for 10.10.0.8</p><p>8080/tcp <span class="p">open</span>  http-proxy</p><p><span class="p">learner@kali</span>:<span class="t">~/lab</span>$ <span class="inline-block h-3.5 w-2 translate-y-0.5 animate-blink bg-zt-neon"></span></p>
        </div>
      </div>

      {# Network topology #}
      <div class="panel">
        <div class="panel-title"><span class="flex items-center gap-2">{% icon "waypoints" "size-3.5 text-zt-neon" %} Topology</span><span>4 hosts</span></div>
        <svg viewBox="0 0 240 150" class="h-auto w-full" role="img" aria-label="Network topology: attacker connected through a firewall and switch to three target hosts">
          <g stroke="#00FF75" stroke-opacity=".5" stroke-width="1.2" fill="none">
            <path class="flow-line" d="M30 75H85"/>
            <path class="flow-line" d="M115 75H150"/>
            <path d="M165 75 205 25M165 75H205M165 75 205 125" stroke-opacity=".3"/>
          </g>
          <g font-family="JetBrains Mono Variable, monospace" font-size="8" fill="#A1AAA4" text-anchor="middle">
            <circle cx="22" cy="75" r="11" fill="#123D29" stroke="#00FF75"/><text x="22" y="100">kali</text>
            <rect x="88" y="63" width="24" height="24" rx="5" fill="#111A15" stroke="#FFB547" stroke-opacity=".7"/><text x="100" y="100">fw</text>
            <circle cx="160" cy="75" r="8" fill="#111A15" stroke="#1B2921" stroke-width="2"/><text x="160" y="100">sw</text>
            <circle cx="212" cy="25" r="8" fill="#0D1410" stroke="#A1AAA4" stroke-opacity=".5"/><text x="212" y="45">.5</text>
            <circle cx="212" cy="75" r="8" fill="#0D1410" stroke="#A1AAA4" stroke-opacity=".5"/><text x="212" y="95">.8</text>
            <circle cx="212" cy="125" r="8" fill="#0D1410" stroke="#FF5252" stroke-opacity=".7"/><text x="212" y="145">.12</text>
          </g>
        </svg>
      </div>

      {# Vulnerable web app #}
      <div class="panel">
        <div class="panel-title"><span class="flex items-center gap-2">{% icon "globe" "size-3.5 text-zt-neon" %} vuln-webapp</span><span class="text-zt-warn">training target</span></div>
        <div class="rounded-lg border border-zt-border bg-zt-bg">
          <div class="flex items-center gap-2 border-b border-zt-border px-2.5 py-1.5 font-mono text-[10px] text-zt-muted">{% icon "lock-open" "size-3 text-zt-warn" %}http://10.10.0.8:8080/login</div>
          <div class="space-y-2 p-3">
            <div class="h-6 rounded border border-zt-border bg-zt-card px-2 font-mono text-[10px] leading-6 text-zt-text2">admin' OR '1'='1</div>
            <div class="h-6 rounded border border-zt-border bg-zt-card"></div>
            <div class="h-6 w-20 rounded bg-zt-neon/80"></div>
          </div>
        </div>
        <p class="mt-2 font-mono text-[10px] text-zt-muted">Objective: find and report the injection flaw</p>
      </div>

      {# SOC monitor #}
      <div class="panel">
        <div class="panel-title"><span class="flex items-center gap-2">{% icon "activity" "size-3.5 text-zt-neon" %} SOC monitor</span><span>demo data</span></div>
        <svg viewBox="0 0 200 60" class="h-16 w-full" preserveAspectRatio="none" aria-hidden="true">
          <defs><linearGradient id="rg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#00FF75" stop-opacity=".35"/><stop offset="1" stop-color="#00FF75" stop-opacity="0"/></linearGradient></defs>
          <path d="M0 48 L15 44 L30 46 L45 38 L60 41 L75 30 L90 34 L105 18 L120 26 L135 22 L150 32 L165 12 L180 24 L200 20 V60 H0Z" fill="url(#rg)"/>
          <path d="M0 48 L15 44 L30 46 L45 38 L60 41 L75 30 L90 34 L105 18 L120 26 L135 22 L150 32 L165 12 L180 24 L200 20" fill="none" stroke="#00FF75" stroke-width="1.5"/>
        </svg>
        <ul class="mt-2 space-y-1.5 font-mono text-[10.5px]">
          <li class="flex justify-between"><span class="text-zt-error">● Port scan detected</span><span class="text-zt-muted">10.10.0.2</span></li>
          <li class="flex justify-between"><span class="text-zt-warn">● SQLi pattern in URI</span><span class="text-zt-muted">10.10.0.8</span></li>
        </ul>
      </div>

      {# Investigation timeline #}
      <div class="panel md:col-span-2 xl:col-span-1">
        <div class="panel-title"><span class="flex items-center gap-2">{% icon "list-tree" "size-3.5 text-zt-neon" %} Investigation timeline</span></div>
        <ol class="relative space-y-3 border-l border-zt-border pl-4 text-xs">
          <li class="relative"><span class="absolute -left-[21px] top-1 size-2 rounded-full bg-zt-neon"></span><span class="font-mono text-zt-muted">10:02</span> <span class="text-zt-text2">Recon from 10.10.0.2</span></li>
          <li class="relative"><span class="absolute -left-[21px] top-1 size-2 rounded-full bg-zt-warn"></span><span class="font-mono text-zt-muted">10:09</span> <span class="text-zt-text2">Injection attempt on /login</span></li>
          <li class="relative"><span class="absolute -left-[21px] top-1 size-2 rounded-full bg-zt-error"></span><span class="font-mono text-zt-muted">10:14</span> <span class="text-zt-text2">Auth bypass, session issued</span></li>
          <li class="relative"><span class="absolute -left-[21px] top-1 size-2 rounded-full border border-zt-muted"></span><span class="font-mono text-zt-muted">--:--</span> <span class="text-zt-muted">Write up findings</span></li>
        </ol>
      </div>
    </div>
  </div>
</figure>
