{% load zt %}
<li class="reveal {% if forloop.last %}sm:col-span-2 lg:col-span-1{% endif %}" style="transition-delay: {{ forloop.counter0 }}00ms">
  <a href="{{ h.url }}" class="card card-hover group flex h-full items-start gap-4 p-5 lg:flex-col lg:gap-5">
    <span class="icon-tile">{% icon h.icon "size-5" %}</span>
    <span class="min-w-0">
      <span class="flex items-center gap-1.5 text-[15px] font-semibold text-zt-text">{{ h.title }}{% icon "arrow-up-right" "size-4 text-zt-muted opacity-0 transition group-hover:opacity-100 group-hover:text-zt-neon" %}</span>
      <span class="mt-1.5 block text-[13px] leading-relaxed text-zt-text2">{{ h.desc }}</span>
    </span>
  </a>
</li>
