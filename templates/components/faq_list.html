{% load zt %}
<div class="reveal divide-y divide-zt-border rounded-2xl border border-zt-border bg-zt-card/60">
  {% for item in faqs %}
    <details class="faq group" {% if forloop.first %}open{% endif %}>
      <summary class="flex min-h-[64px] cursor-pointer list-none items-center justify-between gap-6 px-5 py-4 text-left text-[15px] font-semibold text-zt-text transition hover:text-zt-neon sm:px-6">
        {{ item.q }}
        <span class="faq-icon flex size-8 shrink-0 items-center justify-center rounded-lg border border-zt-border text-zt-text2 transition">{% icon "plus" "size-4" %}</span>
      </summary>
      <p class="px-5 pb-5 text-sm leading-relaxed text-zt-text2 sm:px-6">{{ item.a }}</p>
    </details>
  {% endfor %}
</div>
